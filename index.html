<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Eerste Live Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #24292e; }
        p { color: #586069; }
        .status {
            display: inline-block;
            background-color: #2ea44f;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Welkom op mijn Git website!</h1>
        <p>Dit bestand is succesvol aangemaakt in VS Code en gekoppeld via Git Bash.</p>
        <div class="status">Status: Klaar voor GitHub Pages</div>
    </div>

</body>
</html>
